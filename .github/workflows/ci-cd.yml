name: CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  AZURE_WEBAPP_NAME: formbridge-backend
  AZURE_WEBAPP_PACKAGE_PATH: "./backend"
  PYTHON_VERSION: "3.12"

permissions:
  id-token: write
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Uncomment when you have backend tests
      # - name: Run backend tests
      #   working-directory: ./backend
      #   run: |
      #     source venv/bin/activate
      #     pytest tests/ -v

  build-and-deploy:
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m venv venv
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          enable-AzPSSession: true

      # ------------------------------------------------------------------
      # Deploy infrastructure FIRST
      # ------------------------------------------------------------------
      - name: Deploy infrastructure
        run: |
          az deployment group create \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --template-file ./infra/main.bicep \
            --parameters ./infra/parameters.json

      # ------------------------------------------------------------------
      # Build Docker image
      # ------------------------------------------------------------------
      - name: Login to Azure Container Registry
        run: |
          az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build Docker image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/docproc-fastapi:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/docproc-fastapi:${{ github.sha }}

      # ------------------------------------------------------------------
      # Deploy container
      # ------------------------------------------------------------------
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          images: ${{ secrets.ACR_LOGIN_SERVER }}/docproc-fastapi:${{ github.sha }}

      # Uncomment when Static Web App is ready
      #
      # - name: Deploy frontend
      #   uses: Azure/static-web-apps-deploy@v1
      #   with:
      #     azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
      #     repo_token: ${{ secrets.GITHUB_TOKEN }}
      #     action: upload
      #     app_location: frontend
      #     api_location: ""
      #     output_location: .next
